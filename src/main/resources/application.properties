spring.application.name=imobsys
server.port=8080

# Configuracao do Banco de Dados MariaDB (Padrao XAMPP porta 3306, usuario root sem senha)
spring.datasource.url=jdbc:mariadb://localhost:3306/imobsys?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuracao do Hibernate / JPA (Cria e atualiza as tabelas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true